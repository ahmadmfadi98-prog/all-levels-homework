const KEY='u6hw_v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
['a','c','m','rep','rv','o','done'].forEach(k=>S[k]=S[k]||{});S.name=S.name||'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const DAYS=[['thu','Thursday','Video'],['fri','Friday','Grammar'],['sat','Saturday','Repeat after me'],['sun','Sunday','Reading']];
const Q={}; // id -> {day,label,html(),res()} ; res returns {user,correct,ok} (ok null = not scored)
let cur=(function(){try{return localStorage.getItem(KEY+'_tab')||'thu'}catch(e){return'thu'}})();

function reg(id,day,label,html,res){Q[id]={day,label,html,res};return '<div id="q-'+id+'">'+html()+'</div>'}
function refresh(id){const e=document.getElementById('q-'+id);if(e)e.innerHTML=Q[id].html();updateBars()}

// ---------- widgets ----------
function mcq(id,day,text,opts,ans,n,pic){
  return reg(id,day,text,()=>{
    const a=S.a[id];let h='<div class="q"><div class="t">'+(n?n+'. ':'')+esc(text)+'</div>'+(pic?'<img class="pic" alt="" src="'+D.IMG[pic]+'">':'');
    opts.forEach((o,i)=>{let c='opt';if(a!==undefined){if(i===ans)c+=' ok';else if(i===a)c+=' bad'}
      h+='<button class="'+c+'" onclick="pickMcq(\''+id+'\','+i+')">'+(pic?'':String.fromCharCode(97+i)+') ')+esc(o)+'</button>'});
    if(a!==undefined)h+='<div class="fb '+(a===ans?'ok':'bad')+'">'+(a===ans?'Correct!':'Correct answer: '+esc(opts[ans]))+'</div>';
    return h+'</div>'},
    ()=>{const a=S.a[id];return{user:a===undefined?'':opts[a],correct:opts[ans],ok:a===undefined?false:a===ans}});
}
function pickMcq(id,i){if(S.a[id]!==undefined)return;S.a[id]=i;save();refresh(id)}
function tf(id,day,text,ans,n){
  return reg(id,day,text,()=>{
    const a=S.a[id];let h='<div class="q"><div class="t">'+(n?n+'. ':'')+esc(text)+'</div><div class="row">';
    [true,false].forEach(v=>{let c='opt';if(a!==undefined){if(v===ans)c+=' ok';else if(v===a)c+=' bad'}
      h+='<button class="'+c+'" style="width:auto;min-width:110px" onclick="pickTf(\''+id+'\','+v+')">'+(v?'True':'False')+'</button>'});
    h+='</div>';if(a!==undefined)h+='<div class="fb '+(a===ans?'ok':'bad')+'">'+(a===ans?'Correct!':'Correct answer: '+(ans?'True':'False'))+'</div>';
    return h+'</div>'},
    ()=>{const a=S.a[id];return{user:a===undefined?'':(a?'True':'False'),correct:ans?'True':'False',ok:a===undefined?false:a===ans}});
}
function pickTf(id,v){if(S.a[id]!==undefined)return;S.a[id]=v;save();refresh(id)}
function fill(id,day,text,accept,show,n){
  return reg(id,day,text,()=>{
    const a=S.a[id]||'';const c=S.c[id];
    let h='<div class="q"><div class="t">'+(n?n+'. ':'')+esc(text)+'</div><input class="txt" id="in-'+id+'" value="'+esc(a)+'" placeholder="Type your answer" oninput="S.a[\''+id+'\']=this.value;save()" '+(c?'readonly':'')+'>';
    if(!c)h+='<button class="btn" onclick="chkFill(\''+id+'\')">Check</button>';
    else{const ok=accept.includes(norm(a));h+='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'Correct!':'Correct answer: '+esc(show))+'</div>'}
    return h+'</div>'},
    ()=>{const a=S.a[id]||'';return{user:a,correct:show,ok:accept.includes(norm(a))}});
}
function chkFill(id){S.c[id]=1;save();refresh(id)}
function mistake(id,day,words,wrong,correct,n){
  return reg(id,day,words.join(' '),()=>{
    const a=S.a[id];const c=S.c[id];
    let h='<div class="q"><div class="t">'+(n?n+'. ':'')+'Tap the wrong word.</div><div class="chips">';
    words.forEach((w,i)=>{let k='chip';if(c){if(i===wrong)k+=' pick';}else if(a===i)k+=' pick';
      h+='<span class="'+k+'" onclick="pickMis(\''+id+'\','+i+')">'+esc(w)+'</span>'});
    h+='</div>';
    if(!c)h+='<button class="btn" onclick="chkMis(\''+id+'\')">Check</button>';
    else h+='<div class="fb '+(a===wrong?'ok':'bad')+'">'+(a===wrong?'Correct! ':'The mistake is "'+esc(words[wrong])+'". ')+'Correct sentence: <b>'+esc(correct)+'</b></div>';
    return h+'</div>'},
    ()=>({user:S.a[id]===undefined?'':words[S.a[id]],correct:words[wrong]+' -> '+correct,ok:S.a[id]===wrong}));
}
function pickMis(id,i){if(S.c[id])return;S.a[id]=i;save();refresh(id)}
function chkMis(id){if(S.a[id]===undefined)return;S.c[id]=1;save();refresh(id)}
function build(id,day,words,answer,n){
  return reg(id,day,'Build: '+words.join(' / '),()=>{
    const a=S.a[id]||[];const c=S.c[id];
    let h='<div class="q"><div class="t">'+(n?n+'. ':'')+'Tap the words in the correct order.</div><div class="chips">';
    words.forEach((w,i)=>h+='<span class="chip'+(a.includes(i)?' used':'')+'" onclick="addW(\''+id+'\','+i+')">'+esc(w)+'</span>');
    h+='</div><div class="line">'+esc(a.map(i=>words[i]).join(' '))+'</div>';
    if(!c)h+='<button class="btn" onclick="chkB(\''+id+'\')">Check</button><button class="btn alt" onclick="clrB(\''+id+'\')">Clear</button>';
    else{const ok=norm(a.map(i=>words[i]).join(' '))===norm(answer);h+='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'Correct!':'Correct sentence: <b>'+esc(answer)+'</b>')+'</div>'}
    return h+'</div>'},
    ()=>{const a=S.a[id]||[];const u=a.map(i=>words[i]).join(' ');return{user:u,correct:answer,ok:norm(u)===norm(answer)}});
}
function addW(id,i){if(S.c[id])return;S.a[id]=(S.a[id]||[]).concat(i);save();refresh(id)}
function clrB(id){S.a[id]=[];save();refresh(id)}
function chkB(id){if(!(S.a[id]||[]).length)return;S.c[id]=1;save();refresh(id)}
function writeBox(id,day,text,n){
  return reg(id,day,text,()=>{
    const a=S.a[id]||'';const wc=a.trim()?a.trim().split(/\s+/).length:0;
    return '<div class="q"><div class="t">'+(n?n+'. ':'')+esc(text)+'</div><textarea oninput="S.a[\''+id+'\']=this.value;save();wcount(\''+id+'\');updateBars()">'+esc(a)+'</textarea><div class="sc" id="wc-'+id+'">'+wc+' words</div></div>'},
    ()=>({user:S.a[id]||'',correct:'',ok:null,teacher:true}));
}
function wcount(id){const a=S.a[id]||'';const e=document.getElementById('wc-'+id);if(e)e.textContent=(a.trim()?a.trim().split(/\s+/).length:0)+' words'}
function selfCheck(id,day,q,model,n){
  return reg(id,day,q,()=>{
    const a=S.a[id]||'';const c=S.c[id];const m=S.m[id];
    let h='<div class="q"><div class="t">'+(n?n+'. ':'')+esc(q)+'</div><textarea oninput="S.a[\''+id+'\']=this.value;save()" placeholder="Write a complete sentence">'+esc(a)+'</textarea>';
    if(!c)h+='<button class="btn" onclick="showModel(\''+id+'\')">Show model answer</button>';
    else{h+='<div class="fb ok">Model answer: <b>'+esc(model)+'</b></div><div class="row"><span>Was your answer correct?</span>'
      +'<button class="btn'+(m===1?'':' alt')+'" onclick="selfMark(\''+id+'\',1)">Yes</button><button class="btn'+(m===0?'':' alt')+'" onclick="selfMark(\''+id+'\',0)">Not yet</button></div>'}
    return h+'</div>'},
    ()=>({user:S.a[id]||'',correct:model,ok:S.m[id]===undefined?false:S.m[id]===1}));
}
function showModel(id){S.c[id]=1;save();refresh(id)}
function selfMark(id,v){S.m[id]=v;save();refresh(id)}
function audioBlock(key,title){
  return '<div class="q"><div class="t">'+esc(title)+'</div><audio controls preload="metadata" src="'+D.AUD[key]+'"></audio>'
   +'<details><summary>Show the script (read after you listen)</summary>'+D.SCRIPTS[key].map(l=>'<p style="margin:6px 0">'+esc(l)+'</p>').join('')+'</details></div>';
}
function sec(title,instr,body){return '<div class="sec"><h3>'+title+'</h3><p class="i">'+instr+'</p>'+body+'</div>'}

function thu(){
  let h=sec('Video: A Job Interview in English','Watch the video in six short parts. Watch one part, answer its questions, then go to the next part. You can stop after Part 3 and finish later. (About 21 minutes of video)',
    '<p class="credit">Video: "English Job Interview Dos &amp; Don\'ts" by Rachel\'s English, played from YouTube.</p><details open><summary>Words to learn first</summary>'+D.PRE.map(w=>'<p style="margin:4px 0"><b>'+esc(w[0])+'</b>: '+esc(w[1])+'</p>').join('')+'</details>');
  D.VID.forEach((c,k)=>{
    const T=D.YT[k];let b='<div class="q"><div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/'+D.YTID+'?start='+T[0]+'&end='+T[1]+'&rel=0&playsinline=1" title="'+esc(c.title)+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>'
      +'<div class="sc">Video not playing? <a href="https://www.youtube.com/watch?v='+D.YTID+'&t='+T[0]+'s" target="_blank" rel="noopener">Open this part on YouTube</a> (from '+Math.floor(T[0]/60)+':'+String(T[0]%60).padStart(2,'0')+' to '+Math.floor(T[1]/60)+':'+String(T[1]%60).padStart(2,'0')+').</div></div>';
    let n=0;
    c.mcq.forEach((q,i)=>{b+=mcq('v'+k+'m'+i,'thu',q[0],q[1],q[2],++n)});
    c.tf.forEach((q,i)=>{b+=tf('v'+k+'t'+i,'thu',q[0],q[1],++n)});
    c.fill.forEach((q,i)=>{b+=fill('v'+k+'f'+i,'thu',q[0],q[1],q[2],++n)});
    h+=sec(esc(c.title)+' ('+c.len+')',esc(c.hint),b);
  });
  h+=sec('Useful phrases from the video','Choose the correct meaning.',D.PHR.map((q,i)=>mcq('ph'+i,'thu',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('Your turn','Answer like Rachel. Write 3 to 5 sentences for each. Your teacher will check them.',
    writeBox('vy1','thu','Tell me a little about yourself. (I studied ... / I have been working at ... for ... years. / I have a lot of experience in ...)',1)
   +writeBox('vy2','thu','What is your greatest strength? (My greatest strength is ... I find that this is very important when I ...)',2));
  return h;
}

    +'<div class="sc">I <b>work</b> / she <b>works</b> &nbsp;|&nbsp; I <b>don\'t</b> work / she <b>doesn\'t</b> work &nbsp;|&nbsp; <b>Do</b> you work? <b>Does</b> she work?<br>'

    +'<b>usually, always, every day, often, never</b> &rarr; present simple &nbsp;|&nbsp; <b>now, at the moment, this week, these days</b> &rarr; present continuous<br>'
    +'Some verbs are not usually continuous: <b>know, understand, like, want, need, believe</b>.</div></div>';
  h+=sec('1. Choose the correct form','Choose a, b or c.',D.G_MCQ.map((q,i)=>mcq('g1_'+i,'fri',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('2. Write the verb','Write the verb in the present simple or the present continuous. Then press Check.',D.G_FILL.map((q,i)=>fill('g2_'+i,'fri',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('3. Find the mistake','Each sentence has one mistake. Tap the wrong part, then check.',D.G_MIS.map((m,i)=>mistake('g3_'+i,'fri',m[0],m[1],m[2],i+1)).join(''));
  h+=sec('4. Build the sentence','Tap the words in the correct order.',D.G_BUILD.map((b,i)=>build('g4_'+i,'fri',b[0],b[1],i+1)).join(''));
  h+=sec('5. Action or state?','Choose the correct form. Remember: know, want, need and understand are not usually continuous.',D.G_SV.map((q,i)=>mcq('g5_'+i,'fri',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('6. Your sentences','Write true sentences about your work. The page checks the key words. Your teacher will check the grammar.',D.G_KW.map((q,i)=>writeKw('g6_'+i,'fri',q[0],q[1],i+1)).join(''));
  return h;
}
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
function sayT(txt,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';if(voice)u.voice=voice;u.rate=slow?0.7:0.95;speechSynthesis.speak(u)}catch(e){tip('Audio is not available on this device.')}}
function say(i,slow){sayT(D.SENT[i],slow)}
function sat(){
  let h='<div class="sec"><h3>Listen and repeat</h3><p class="i">Press the blue button to hear the sentence. Say it aloud 2 times. Say the <b>bold</b> words louder and longer: this is sentence stress. Then tick the box. Press the turtle for slow speed.</p><div class="sc" id="repc"></div></div>';
  D.GROUPS.forEach(g=>{
    h+='<div class="sec"><h3>'+g[0]+'</h3>';
    for(let i=g[1];i<g[2];i++)h+='<div class="sent'+(S.rep[i]?' done':'')+'" id="s-'+i+'"><div class="n">'+(i+1)+'</div><div class="s">'+D.SENTH[i]+'</div><button class="play" title="Play" onclick="say('+i+',false)">&#9654;</button><button class="play" style="background:var(--gold)" title="Slow" onclick="say('+i+',true)">&#128034;</button><input type="checkbox" '+(S.rep[i]?'checked':'')+' onchange="tickRep('+i+',this.checked)" style="width:22px;height:22px" aria-label="Repeated"></div>';
    h+='</div>';
  });
  return h;
}
function tickRv(i,v){S.rv[i]=v?1:0;save();const e=document.getElementById('v-'+i);if(e)e.classList.toggle('done',!!v);updateBars()}
function tickRep(i,v){S.rep[i]=v?1:0;save();const e=document.getElementById('s-'+i);if(e)e.classList.toggle('done',!!v);updateBars()}
function sun(){
  let text='<p class="sc" style="margin-top:0">This is an example handbook from an imaginary organisation.</p>';D.READ.forEach(p=>{text+=(p[0]?'<h4 style="margin:12px 0 4px">'+esc(p[0])+'</h4>':'')+'<p>'+markWords(esc(p[1]))+'</p>'});
  let h=sec('Reading: Staff and Volunteer Handbook','Read the handbook page. Tap a dotted word to see its meaning. Then do the exercises. (About '+D.READ_N+' words)','<div class="reading">'+text+'</div>');
  h+=sec('1. Multiple choice','Choose the best answer.',D.S_MCQ.map((q,i)=>mcq('s1_'+i,'sun',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('2. True or false','Choose True or False.',D.S_TF.map((q,i)=>tf('s2_'+i,'sun',q[0],q[1],i+1)).join(''));
  h+=sec('3. Which section?','Read each situation. Which section of the handbook answers it?',D.S_SEC.map((q,i)=>mcq('s3_'+i,'sun',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('4. Vocabulary','Complete each sentence with a word or phrase from the text.',D.S_VOC.map((q,i)=>fill('s4_'+i,'sun',q[0],q[1],q[2],i+1)).join(''));
  h+=sec('5. Your workplace','Write one sentence for each. The page checks the key words. Your teacher will check the grammar.',D.S_KW.map((q,i)=>writeKw('s5_'+i,'sun',q[0],q[1],i+1)).join(''));
  h+=sec('6. Your opinion (optional)','Which rule in the handbook is the most important? Why? Write 3 sentences.',writeBox('s6_0','sun','Your opinion',1));
  return h;
}
function writeKw(id,day,text,re,n){
  const R=new RegExp(re,'i');
  setTimeout(()=>{if(Q[id])Q[id].re=R},0);
  return reg(id,day,text,()=>{
    const a=S.a[id]||'';const ok=R.test(a)&&a.trim().split(/\s+/).length>=5;
    return '<div class="q"><div class="t">'+(n?n+'. ':'')+esc(text)+'</div><textarea style="min-height:60px" oninput="S.a[\''+id+'\']=this.value;save();kwFb(\''+id+'\');updateBars()">'+esc(a)+'</textarea><div class="fb" id="kw-'+id+'">'+(a.trim()?(ok?'<span class="ok">Key words found.</span>':'<span class="bad">Use the key words and write a full sentence.</span>'):'')+'</div></div>'},
    ()=>{const a=S.a[id]||'';return{user:a,correct:'',ok:null,teacher:true}});
}
function kwFb(id){const a=S.a[id]||'';const R=Q[id].re;const r={user:a,ok:R?(R.test(a)&&a.trim().split(/\s+/).length>=5):true};const e=document.getElementById('kw-'+id);if(e)e.innerHTML=(r.user.trim()?(r.ok?'<span style="color:var(--ok)">Key words found.</span>':'<span style="color:var(--bad)">Use the key words and write a full sentence.</span>'):'')}
function markWords(t){Object.keys(D.WORDS).sort((a,b)=>b.length-a.length).forEach(w=>{const re=new RegExp('\\b('+w+')\\b','gi');t=t.replace(re,m=>'<span class="w" onclick="meaning(\''+w+'\')">'+m+'</span>')});return t}
function meaning(w){tip('<b>'+w+'</b>: '+D.WORDS[w])}
let tipT;function tip(h){const e=document.getElementById('tip');e.innerHTML=h;e.style.display='block';clearTimeout(tipT);tipT=setTimeout(()=>e.style.display='none',4000)}

// ---------- progress ----------
function dayProg(d){
  if(d==='sat'){const n=Object.values(S.rep).filter(Boolean).length;return{done:n,total:50,pts:n,max:50}}
  let done=0,total=0,pts=0,max=0;
  Object.keys(Q).forEach(id=>{const q=Q[id];if(q.day!==d)return;const r=q.res();
    total++;
    if(r.ok===null){if(String(S.a[id]||'').trim())done++;}
    else{max++;const answered=(S.a[id]!==undefined&&S.a[id]!==''&&!(Array.isArray(S.a[id])&&!S.a[id].length));if(answered)done++;if(r.ok)pts++}});
  return{done,total,pts,max};
}
function updateBars(){
  DAYS.forEach(d=>{const p=dayProg(d[0]);const e=document.getElementById('bar-'+d[0]);if(e)e.style.width=(p.total?Math.round(100*p.done/p.total):0)+'%';
    const s=document.getElementById('sum-'+d[0]);if(s)s.textContent=p.done+' / '+p.total+(p.max?'   Score: '+p.pts+' / '+p.max:'');
    const r=document.getElementById('repc');if(r&&d[0]==='sat')r.textContent=p.done+' of 50 sentences repeated'});
}

// ---------- report ----------
function reportText(d){
  const dn=DAYS.find(x=>x[0]===d);const p=dayProg(d);const L=[];
  L.push('Unit 6 Homework: '+dn[1]+' ('+dn[2]+')');
  L.push('Name: '+(S.name||'(not written)')+'   Date: '+new Date().toLocaleDateString('en-GB'));
  L.push(p.max?('Score: '+p.pts+' / '+p.max+' | Completed: '+p.done+' / '+p.total):('Completed: '+p.done+' / '+p.total));L.push('');
  const rows=[];
  if(d==='sat'){D.SENT.forEach((s,i)=>rows.push({t:(i+1)+'. ['+(S.rep[i]?'x':' ')+'] '+s,c:S.rep[i]?'ok':''}))}
  else{let n=0;Object.keys(Q).forEach(id=>{const q=Q[id];if(q.day!==d)return;n++;const r=q.res();
    rows.push({t:n+'. '+q.label,b:1});
    const mark=r.ok===null?(r.teacher?'  [teacher to check]':''):(r.ok?'  [correct]':'  [check]');
    rows.push({t:'   Your answer: '+(r.user===''?'(no answer)':r.user)+mark,c:r.ok===null?'':(r.ok?'ok':'bad')});
    if(r.ok===false&&r.correct)rows.push({t:'   Correct: '+r.correct,c:'ok'});rows.push({t:''})})}
  return {head:L,rows:rows,text:L.join('\n')+'\n'+rows.map(r=>r.t).join('\n')};
}
function pdfReport(d){
  if(!S.name||!S.name.trim()){tip('Please write your name at the top first.');window.scrollTo(0,0);const e=document.getElementById('nm');if(e){e.focus();e.style.outline='3px solid #e0553d'}return}
  const R=reportText(d);let e=document.getElementById('rep-'+d);
  if(!e){e=document.createElement('div');e.className='sec repview';e.id='rep-'+d;document.getElementById('p-'+d).appendChild(e)}
  e.innerHTML='<h3>Your report</h3><p class="i">Press <b>Copy report</b> and paste it into WhatsApp, or press <b>Download PDF</b> and send the file to your teacher.</p>'
    +'<button class="btn" onclick="copyRep(\''+d+'\')">Copy report</button><button class="btn pdf" onclick="pdfDl(\''+d+'\')">Download PDF</button>'
    +'<div style="margin-top:10px">'+R.head.map(x=>'<div class="r"><b>'+esc(x)+'</b></div>').join('')+R.rows.map(r=>'<div class="r" style="'+(r.b?'font-weight:600;':'')+(r.c==='ok'?'color:var(--ok)':r.c==='bad'?'color:var(--bad)':'')+'">'+(esc(r.t)||'&nbsp;')+'</div>').join('')+'</div>'
    +'<textarea id="rt-'+d+'" readonly hidden style="min-height:160px;margin-top:10px"></textarea>';
  e.scrollIntoView({behavior:'smooth'});
}
function pdfDl(d){
  if(!window.jspdf){tip('The PDF tool is still loading. Check your internet and try again, or use Copy report.');return}
  const R=reportText(d);const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=18;
  const clean=s=>String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x20-\x7E]/g,'');
  const put=(t,sz,bold,col)=>{doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');doc.setTextColor.apply(doc,col);
    doc.splitTextToSize(clean(t)||' ',180).forEach(l=>{if(y>282){doc.addPage();y=18}doc.text(l,15,y);y+=sz*0.5+1.4})};
  R.head.forEach((h,i)=>put(h,i===0?15:10.5,i!==1,i===0?[20,73,60]:[30,40,50]));
  R.rows.forEach(r=>put(r.t,10,!!r.b,r.c==='ok'?[27,138,75]:r.c==='bad'?[192,57,43]:[30,40,50]));
  doc.save('Unit6_'+DAYS.find(x=>x[0]===d)[1]+'_Report_'+clean(S.name).replace(/\s+/g,'_')+'.pdf');
}
function copyRep(d){
  const txt=reportText(d).text;const ta=document.getElementById('rt-'+d);
  const fallback=()=>{ta.value=txt;ta.hidden=false;ta.focus();ta.select();tip('Select all the text in the box and copy it.')};
  try{navigator.clipboard.writeText(txt).then(()=>tip('Report copied. Now paste it to your teacher.')).catch(fallback)}catch(e){fallback()}
}

// ---------- render ----------
function setTab(t){cur=t;try{localStorage.setItem(KEY+'_tab',t)}catch(e){}
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));window.scrollTo(0,0)}
function init(){
  const nm=document.getElementById('nm');nm.value=S.name;nm.oninput=()=>{S.name=nm.value;save()};
  const fns={thu,fri,sat,sun};
  let tabs='',panels='';
  DAYS.forEach(d=>{
    tabs+='<button class="tab" data-t="'+d[0]+'" onclick="setTab(\''+d[0]+'\')"><b>'+d[1]+'</b>'+d[2]+'<div class="bar"><i id="bar-'+d[0]+'"></i></div></button>';
    panels+='<div class="panel" id="p-'+d[0]+'"><h2>'+d[1]+': '+d[2]+'</h2><div class="sc" id="sum-'+d[0]+'"></div>'+fns[d[0]]()
      +'<div class="done-row"><label><input type="checkbox" id="dn-'+d[0]+'" '+(S.done[d[0]]?'checked':'')+' onchange="S.done[\''+d[0]+'\']=this.checked?1:0;save()"> I finished '+d[1]+'</label><button class="btn pdf" onclick="pdfReport(\''+d[0]+'\')">My report</button></div></div>';
  });
  document.getElementById('tabs').innerHTML=tabs;document.getElementById('panels').innerHTML=panels;
  pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
  setTab(DAYS.some(d=>d[0]===cur)?cur:'thu');updateBars();
}
init();
</script>
